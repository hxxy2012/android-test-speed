<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/speedtest

    <Directory /var/www/speedtest>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Enable CORS
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, HEAD, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type"
    </Directory>

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/speedtest-error.log
    CustomLog ${APACHE_LOG_DIR}/speedtest-access.log combined
</VirtualHost>
